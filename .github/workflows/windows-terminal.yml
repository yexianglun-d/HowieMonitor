name: Native Windows terminal regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-terminal:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Select locked .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: global.json
      - name: Check native terminal only
        shell: pwsh
        run: |
          dotnet restore tests/Howie.Monitor.Server.Tests/Howie.Monitor.Server.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build tests/Howie.Monitor.Server.Tests/Howie.Monitor.Server.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test tests/Howie.Monitor.Server.Tests/Howie.Monitor.Server.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~NativeTerminalTests --logger 'console;verbosity=normal'
          if ($LASTEXITCODE -ne 0) { throw 'Native terminal check failed.' }
